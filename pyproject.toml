[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mahatraffic-ai"
version = "0.1.0"
description = "A Reliable Multi-Agent Road-Risk Intelligence System using Big Data, Social Media Analytics, MCP and Guardrails"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "MahaTraffic AI Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "pymongo>=4.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
bigdata = [
    "pyspark>=3.5.0",
    "fastparquet>=2024.2.0",
]
agents = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0",
    "mcp>=1.0.0",
]
rag = [
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=2.6.0",
]
social = [
    "networkx>=3.2.0",
    "python-louvain>=0.16",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"
